<!doctype html>
<!-- THROWAWAY PROTOTYPE (wayfinder #245): the grafted composition from live review —
     the ledger-as-instrument panel (figures are the doors) over the one-shop tabbed
     sheet (ν nous / ◇ Arete faces, fixed size). Era (pre-prestige / first Arete /
     entered), mode (upgrade / flow), telegraph-slot and chip-bonus toggles drive the
     locked, empty, and inert states. Illustrative figures, in-memory only, no saves.
     Run: python3 -m http.server 5174 → /src/ui/ledger-catalog.prototype.html -->
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlowSynth · ledger &amp; catalog navigation prototype</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap');
:root{color-scheme:dark;--bg:#0d1122;--panel:#141a30;--line:#414a75;--soft:#2a3150;--ink:#e5e9f5;--muted:#99a1c2;--nous:#cbcaff;--arete:#b994f5;--switch:#cc603d;--clip:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'IBM Plex Sans',sans-serif}
button{font:600 17px 'Barlow Condensed',sans-serif;color:inherit;background:none;border:1px solid var(--line);padding:10px 15px;min-height:44px;cursor:pointer}
button:hover:not(:disabled){background:#252d48}button:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
button:disabled{color:var(--muted);border-color:var(--soft);cursor:default}
h1,h2,h3,.name,nav{font-family:'Barlow Condensed',sans-serif;font-weight:600}h1{font-size:22px;margin:0}h2{font-size:26px;margin:0}h3{font-size:22px;margin:0}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}.dim{color:var(--muted)}.arete{color:var(--arete)}
.notice{padding:7px 26px;border-bottom:1px solid var(--soft);font:13px 'IBM Plex Sans';color:var(--muted)}
/* ── switcher (prototype chrome, not the design) ── */
.switcher{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:#c6cddd;color:#12172b;border-radius:999px;padding:7px 12px;box-shadow:0 8px 24px #0008;z-index:50;font:600 14px 'Barlow Condensed';flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px)}
.switcher button{border:0;min-height:0;padding:4px 10px;font:inherit;color:inherit;border-radius:999px;white-space:nowrap}
.switcher button:hover:not(:disabled){background:#aeb6c9}
.switcher .seg{display:flex;gap:2px;background:#12172b;border-radius:999px;padding:3px}
.switcher .seg button{color:#c6cddd;font-size:13.5px}.switcher .seg button[aria-pressed=true]{background:#c6cddd;color:#12172b}
.switcher label{display:flex;align-items:center;gap:5px;font:500 12.5px 'IBM Plex Sans';cursor:pointer;max-width:130px}
/* ── stage: desktop + phone frames side by side ── */
.stage{display:flex;gap:26px;padding:16px 26px 120px;align-items:flex-start}
.frame{position:relative;height:790px;background:var(--bg);border:1px solid var(--soft);overflow:hidden;flex-shrink:0}
.desktop{flex:1;min-width:860px}
.phone{width:392px}
@media(max-width:1380px){.stage{flex-direction:column}.desktop{min-width:0;width:100%}}
/* desktop chrome */
.top{height:64px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--soft);padding:0 26px;gap:16px}
.top .session{display:flex;align-items:center;gap:16px}.top .mono{font-size:19px}
.top .flow{color:var(--switch);border-color:var(--switch)}.top .flow:hover:not(:disabled){background:var(--bg);color:#e28a69}
/* ── the ledger: one clipped instrument panel; the figures are the doors ── */
.instrument{margin:14px 26px 0;background:var(--line);clip-path:var(--clip);padding:1px}
.instrument-inner{background:var(--panel);clip-path:var(--clip);display:flex;align-items:center;gap:24px;padding:16px 24px}
.figure{border:0;padding:8px 10px;min-height:0;display:flex;align-items:baseline;gap:6px;cursor:pointer}
.figure b{font:500 27px 'IBM Plex Mono';font-variant-numeric:tabular-nums}.figure small{font:600 15px 'Barlow Condensed';color:var(--muted)}
.figure:hover:not(:disabled){background:none;box-shadow:inset 0 -3px var(--ink)}
.figure.nunit small{color:var(--nous)}
.figure.arete{color:var(--arete);margin-left:auto}.figure.arete small{color:var(--arete)}
.figure svg,.ghost svg{width:17px;height:17px}
.ghost{border:0;min-height:0;padding:8px 10px;display:flex;align-items:center;gap:8px;cursor:pointer;font:600 17px 'Barlow Condensed'}
.ghost:hover:not(:disabled){background:none;box-shadow:inset 0 -3px var(--ink)}
.ghost .mono{font-size:15px;font-variant-numeric:tabular-nums}.ghost .bonus{color:var(--muted);font-size:14px}
/* board scene + dock */
.scene{position:relative;padding:8px 26px 90px}
.board{width:100%;display:flex;justify-content:center}
.board svg{width:min(560px,100%);overflow:visible}
.dock{position:absolute;left:26px;top:16px;display:flex;gap:7px}
.dock button[aria-pressed=true]{box-shadow:inset 0 -3px var(--ink)}
/* horizon (context, not subject) */
.horizon{position:absolute;bottom:12px;left:4%;right:4%;display:flex;gap:12px;align-items:center;font:13px 'IBM Plex Sans';color:var(--muted)}
.horizon .track{height:3px;flex:1;background:var(--soft);position:relative}.horizon .track i{position:absolute;inset:0 54% 0 0;background:var(--arete)}
/* ── the one shop: tabbed sheet, fixed size ── */
.scrim{position:absolute;inset:0;background:#05081499;display:none;z-index:10}.scrim.open{display:block}
.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,94%);height:min(600px,88%)}
.panel{background:var(--line);clip-path:var(--clip);padding:1px;height:100%}
.panel-inner{background:var(--panel);clip-path:var(--clip);padding:26px 28px;position:relative;height:100%;display:flex;flex-direction:column}
.identity{position:absolute;top:20px;right:22px;color:var(--arete)}.identity svg{width:28px;height:30px}
.identity.nous{color:var(--nous)}.identity.nous b{font:500 24px 'IBM Plex Mono'}
.face-switch{position:absolute;top:18px;left:22px;display:flex;gap:4px}
.face-switch button{border:0;min-height:0;padding:6px 10px;display:flex;align-items:center;gap:6px;font-size:17px;color:var(--muted)}
.face-switch button svg{width:15px;height:15px}
.face-switch button[aria-pressed=true]{color:var(--ink);box-shadow:inset 0 -3px var(--ink)}
.face-switch button:disabled{opacity:.45}
.face-switch button[data-face=nous][aria-pressed=true]{color:var(--nous)}.face-switch button[data-face=arete][aria-pressed=true]{color:var(--arete)}
.sheet-body{flex:1;overflow:auto;margin-top:44px;min-height:0}
.catalog-sections{display:grid;gap:30px}
.catalog-sections h2{margin:0 0 4px}
.kind{font:13.5px 'IBM Plex Sans';color:var(--muted)}
.catalog-row{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:15px 0;border-top:1px solid var(--soft)}
.catalog-row h3{font-size:21px}.catalog-row p{margin:5px 0 0;font-size:14px}
.catalog-row .price{flex-shrink:0;min-height:42px}
.price.arete{color:var(--arete);border-color:var(--arete)}.price.arete:hover:not(:disabled){background:#1c1533}
.completion{font:12px 'IBM Plex Mono';box-shadow:inset 0 -1px var(--muted);padding:8px 2px;flex-shrink:0;color:var(--muted)}
.empty-copy{color:var(--muted);font-size:14px;margin:12px 0 0}
.entry-screen{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.entry-buy{border-color:var(--arete);color:var(--arete);display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 30px;font-size:26px}
.entry-buy:hover:not(:disabled){background:#1c1533}
.flow-note{color:var(--muted);font:14px 'IBM Plex Sans';margin:16px 0 0}
/* ── phone frame ── */
.p-strip{display:flex;align-items:center;gap:16px;padding:12px 16px;border-bottom:1px solid var(--soft)}
.p-strip .figure{padding:6px 4px}.p-strip .figure b{font-size:19px}.p-strip .figure small{font-size:13px}
.p-strip .figure.arete{margin-left:auto}
.p-board{display:flex;justify-content:center;padding-top:44px}
.p-board svg{width:320px}
.p-thumb{position:absolute;bottom:0;left:0;right:0;display:flex;border-top:1px solid var(--line);background:var(--panel)}
.p-thumb button{flex:1;border:0;border-left:1px solid var(--soft);font-size:15.5px;padding:12px 2px;min-height:52px}
.p-thumb button:first-child{border-left:0}
.p-thumb button:disabled{opacity:.5}
.p-sheet{position:absolute;left:0;right:0;bottom:0;top:auto;transform:none;width:auto;height:74%;max-width:none;max-height:none}
.p-sheet .panel-inner{clip-path:polygon(0 14px,100% 0,100% 100%,0 100%)}
.entry-screen{height:100%}
/* tooltips (standards pattern: hover, focus, tap; Escape dismisses) */
.tooltip-host{position:relative;display:inline-block}
.tip{padding:0;border:0;min-height:0;font:inherit;text-align:left;cursor:help}
.tip:hover:not(:disabled){background:none;color:var(--nous)}
.tooltip{display:none;position:absolute;left:0;top:100%;width:min(270px,72vw);padding:13px 15px;border:1px solid var(--line);background:#0a0e1b;color:var(--ink);font:14px/1.5 'IBM Plex Sans';z-index:20;box-shadow:0 8px 20px #0005}
.tooltip-host:hover .tooltip,.tooltip-host:focus-within .tooltip,.tooltip-host.show .tooltip{display:block}
</style>
<body data-era="banked" data-mode="upgrade">
<div class="notice">Throwaway navigation study · Arete mark and Accelerator are placeholders · illustrative figures, no saves · ledger loses the session read</div>
<div class="stage">
  <section class="frame desktop" aria-label="Desktop composition">
    <header class="top"><h1>FlowSynth</h1><div class="session"><span class="mono">20:00</span><button class="flow">Enter flow</button></div></header>
    <div id="ledger-host"></div>
    <div class="scene">
      <div class="dock" id="dock"></div>
      <div class="board" aria-hidden="true"><svg viewBox="0 0 600 360"><defs><g id="hex"><path d="M0-88 76-44V44L0 88-76 44V-44Z" fill="#141a30" stroke="#414a75" stroke-width="2"/><path d="M0-80 68-40V40L0 80-68 40V-40Z" fill="none" stroke="#2a3150"/></g></defs>
        <path d="M205 128 370 128 288 264" fill="none" stroke="#9affa8" stroke-width="2"/>
        <g transform="translate(205 128)"><use href="#hex"/><path d="M-60-30v60" stroke="#6360d4" stroke-width="5"/><text y="-30" text-anchor="middle" fill="#e5e9f5" font-size="14" font-family="Barlow Condensed">OSCILLATOR</text><text y="42" text-anchor="middle" fill="#e5e9f5" font-size="19" font-family="IBM Plex Mono">18.6 ν/s</text></g>
        <g transform="translate(370 128)"><use href="#hex"/><path d="M-60-30v60" stroke="#238858" stroke-width="5"/><text y="-30" text-anchor="middle" fill="#e5e9f5" font-size="14" font-family="Barlow Condensed">GENERATOR</text><text y="46" text-anchor="middle" fill="#9affa8" font-size="17" font-family="IBM Plex Mono">0.8/s</text></g>
        <g transform="translate(288 264)"><use href="#hex"/><path d="M-60-30v60" stroke="#bc9239" stroke-width="5"/><text y="-30" text-anchor="middle" fill="#e5e9f5" font-size="14" font-family="Barlow Condensed">FORGE</text><text y="48" text-anchor="middle" fill="#e5e9f5" font-size="17" font-family="IBM Plex Mono">next roll</text></g>
      </svg></div>
    </div>
    <div class="horizon"><span>Arete</span><span class="track"><i></i></span><span class="mono">46%</span></div>
    <div class="scrim" id="desk-scrim"></div>
  </section>
  <section class="frame phone" aria-label="Phone composition">
    <div class="p-strip" id="p-strip"></div>
    <div class="p-board" aria-hidden="true"><svg viewBox="0 0 300 230"><defs><g id="phex"><path d="M0-46 40-23V23L0 46-40 23V-23Z" fill="#141a30" stroke="#414a75" stroke-width="2"/><path d="M0-41 35-20.5V20.5L0 41-35 20.5V-20.5Z" fill="none" stroke="#2a3150"/></g></defs>
      <path d="M103 62 197 62 150 142" fill="none" stroke="#9affa8" stroke-width="2"/>
      <g transform="translate(103 62)"><use href="#phex"/><path d="M-32-16v32" stroke="#6360d4" stroke-width="3"/><text y="30" text-anchor="middle" fill="#e5e9f5" font-size="12" font-family="IBM Plex Mono">18.6</text></g>
      <g transform="translate(197 62)"><use href="#phex"/><path d="M-32-16v32" stroke="#238858" stroke-width="3"/></g>
      <g transform="translate(150 142)"><use href="#phex"/><path d="M-32-16v32" stroke="#bc9239" stroke-width="3"/></g>
    </svg></div>
    <div class="p-thumb" id="p-thumb"></div>
    <div class="scrim" id="ph-scrim"></div>
  </section>
</div>
<div class="switcher">
  <span class="seg" id="era-seg"></span>
  <span class="seg" id="mode-seg"></span>
  <label><input type="checkbox" id="telegraph"> pre-prestige slot</label>
  <label><input type="checkbox" id="bonuses" checked> chip bonuses</label>
</div>
<script>
'use strict';
const GLYPH = `<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M5 25 16 5 27 25 M9 19H23 M16 5V25"/></svg>`;
const GLYPH_S = `<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 25 16 5 27 25 M9 19H23 M16 5V25"/></svg>`;
const S = {
  era: 'banked',          // pre | banked | entered
  mode: 'upgrade',        // upgrade | flow
  telegraph: false,
  bonuses: true,
  bank: 1,                // illustrative banked Arete
  poolJoined: false, accelBought: false, breakBought: false,
  sheet: null,            // null | { face: 'nous' | 'arete' }
};
const ERAS = { pre: 'Before prestige', banked: 'First Arete', entered: 'Entered' };
const MODES = { upgrade: 'Upgrade mode', flow: 'In flow' };

const tip = (id, label, text) => `<span class="tooltip-host"><button class="tip" aria-describedby="${id}" aria-expanded="false">${label}</button><span class="tooltip" id="${id}" role="tooltip">${text}</span></span>`;
const upgrade = () => S.mode === 'upgrade';
const flowNote = () => upgrade() ? '' : `<p class="flow-note">Arete is spent between sessions — enter upgrade mode to buy.</p>`;
const bonus = (span) => S.bonuses ? span : '';

/* ── the ledger ── */
function areteFigure() {
  if (S.era === 'pre') return S.telegraph ? `<span class="figure arete" style="cursor:default" title="Banked by prestige"><b class="mono dim">—</b><small>◇</small></span>` : '';
  return `<button class="figure arete" data-open="arete" title="Arete Catalog"><b class="mono">${S.bank}</b><small>${GLYPH_S}</small></button>`;
}
function ledgerHtml() {
  return `<div class="instrument"><div class="instrument-inner">
    <button class="figure nunit" data-open="nous" title="The nous shop — starter-shelf offers and board cells"><b class="mono">1.24k</b><small>ν</small></button>
    <span class="figure" title="Rate — the module details keep their own door in production"><b class="mono">18.6</b><small>ν/s</small></span>
    <button class="ghost" data-open="feats">Feats <b class="mono">6/18</b>${bonus('<span class="bonus mono">+12%</span>')}</button>
    <button class="ghost" data-open="chords">Chords <b class="mono">4/11</b>${bonus('<span class="bonus mono">+8% ν</span>')}</button>
    ${areteFigure()}
  </div></div>`;
}
function dockHtml() {
  const inert = !upgrade();
  return `
    <button ${inert ? 'disabled' : ''} title="Forge — settle banked choices">Forge</button>
    <button ${inert ? 'disabled' : ''} title="New cell — arm a frontier purchase">New cell</button>
    <button title="Inventory — the tray">Inventory</button>`;
}
function stripHtml() {
  return `<button class="figure nunit" data-open="nous" title="The nous shop"><b class="mono">1.24k</b><small>ν</small></button>
    <span class="figure" title="Rate — tap opens the module details in production"><b class="mono">18.6</b><small>ν/s</small></span>
    ${S.era === 'pre'
      ? (S.telegraph ? `<span class="figure arete" style="cursor:default" title="Banked by prestige"><b class="mono dim">—</b><small>◇</small></span>` : '')
      : `<button class="figure arete" data-open="arete" title="Arete Catalog"><b class="mono">${S.bank}</b><small>${GLYPH_S}</small></button>`}`;
}
function thumbHtml() {
  const inert = !upgrade();
  return `
    <button ${inert ? 'disabled' : ''}>Forge</button>
    <button ${inert ? 'disabled' : ''}>New cell</button>
    <button>Inventory</button>
    <button data-open="feats">Feats</button>
    <button data-open="chords">Chords</button>`;
}

/* ── sheet content ── */
function areteContent() {
  if (S.era === 'banked') {
    return `<div class="entry-screen">
      <button class="entry-buy" id="buy-entry" ${upgrade() ? '' : 'disabled'} title="${upgrade() ? 'Spend 1 Arete' : 'Arete is spent between sessions'}"><span>Unlock Mutator Layer</span><span class="mono">1 Arete</span></button>
      ${flowNote()}</div>`;
  }
  const accel = S.accelBought
    ? `<span class="completion">ACQUIRED</span>`
    : `<button class="price arete" data-buy="accel" ${upgrade() && S.bank >= 3 ? '' : 'disabled'} title="${upgrade() ? 'Spend 3 Arete' : 'Arete is spent between sessions'}">3 Arete</button>`;
  const brk = S.breakBought
    ? `<span class="completion">ACQUIRED</span>`
    : `<button class="price arete" data-buy="break" ${upgrade() && S.bank >= 10 ? '' : 'disabled'} title="${upgrade() ? 'Spend 10 Arete' : 'Arete is spent between sessions'}">10 Arete</button>`;
  const pool = S.poolJoined
    ? ''
    : `<article class="catalog-row"><div><h3>Mutator Forge <span class="kind">(module type)</span></h3><p>Fill with charge → Mutator draft</p></div>
        <button class="price arete" data-buy="pool" ${upgrade() && S.bank >= 5 ? '' : 'disabled'} title="${upgrade() ? 'Spend 5 Arete' : 'Arete is spent between sessions'}">5 Arete</button></article>`;
  const emptyUnlocks = S.poolJoined ? `<p class="empty-copy">Nothing waits — future objects appear in future rolls.</p>` : '';
  return `<div class="catalog-sections"><section>
    <h2>Upgrades</h2>
    <article class="catalog-row"><div><h3>Mutator layer</h3><p>Unlocks: Mutator Grid · 1 Mutator slot · 1 Mutator roll · this catalog</p></div><span class="completion">ACQUIRED</span></article>
    <article class="catalog-row"><div><h3>${tip('t-accel', 'Arete Accelerator <span class="kind">(placeholder)</span>', 'Placeholder study only — current claim behavior is unchanged. Illustration: +2 Arete per reset (current +1).')}</h3></div>${accel}</article>
    <article class="catalog-row"><div><h3>${tip('t-break', 'Horizon break', 'Score past the horizon line raises each prestige\u2019s claim, up to a hard cap — still banked only on reset.')}</h3></div>${brk}</article>
  </section><section>
    <h2>${tip('t-unlocks', 'Unlocks', 'Will appear in future rolls.')}</h2>
    ${pool}${emptyUnlocks}
  </section></div>${flowNote()}`;
}
function nousContent() {
  const shelf = [['Focus Generator', 'keys a reserve to your practice time', 40], ['Booster', 'uplifts adjacent oscillators', 40], ['Module Forge', 'charge thresholds mint module rolls', 80]];
  return `<div class="catalog-sections"><section>
    <h2>Starter shelf</h2>
    ${shelf.map(([n, d, p]) => `<article class="catalog-row"><div><h3>${n}</h3><p>${d}</p></div><button class="price" ${upgrade() ? '' : 'disabled'} title="${upgrade() ? 'Spend ' + p + ' ν' : 'Purchases happen between sessions'}">${p} ν</button></article>`).join('')}
  </section><section>
    <h2>Cells</h2>
    <article class="catalog-row"><div><h3>Board cell</h3><p>Empty hexes to place modules on — the frontier prices the next one.</p></div><button class="price" ${upgrade() ? '' : 'disabled'} title="${upgrade() ? 'Arm the purchase — pick a frontier hex' : 'Purchases happen between sessions'}">30 ν</button></article>
    <p class="kind" style="margin:12px 0 0">Each purchase raises the next price.</p>
  </section></div>`;
}

/* ── sheet chrome: one shop, two faces, fixed frame ── */
function sheetFrame(face) {
  const tab = (f, mark, word) => `<button data-face-tab="${f}" aria-pressed="${face === f}" data-face="${f}" ${S.era === 'pre' && f === 'arete' ? 'disabled title="Banked by prestige"' : `title="${word}"`}>${mark}<span>${word}</span></button>`;
  const identity = face === 'nous' ? `<span class="identity nous"><b class="mono">ν</b></span>` : `<span class="identity">${GLYPH}</span>`;
  return `<div class="panel"><div class="panel-inner">
    <span class="face-switch">${tab('nous', '<b class="mono">ν</b>', 'nous')}${tab('arete', GLYPH_S, 'Arete')}</span>
    ${identity}
    <div class="sheet-body">${face === 'arete' ? areteContent() : nousContent()}</div>
  </div></div>`;
}

/* ── render ── */
function renderLedger() {
  document.getElementById('ledger-host').innerHTML = ledgerHtml();
  document.getElementById('dock').innerHTML = dockHtml();
  document.getElementById('p-strip').innerHTML = stripHtml();
  document.getElementById('p-thumb').innerHTML = thumbHtml();
}
function renderSheet() {
  const desk = document.getElementById('desk-scrim'), ph = document.getElementById('ph-scrim');
  const open = !!S.sheet;
  desk.classList.toggle('open', open); ph.classList.toggle('open', open);
  desk.innerHTML = open ? `<div class="sheet">${sheetFrame(S.sheet.face)}</div>` : '';
  ph.innerHTML = open ? `<div class="sheet p-sheet">${sheetFrame(S.sheet.face)}</div>` : '';
}
function renderAll() { renderLedger(); renderSheet(); }

/* ── events ── */
document.addEventListener('click', (e) => {
  const opener = e.target.closest('[data-open]');
  if (opener) {
    const kind = opener.dataset.open;
    if (kind === 'feats' || kind === 'chords') return; // out of this study's scope; no sheet
    S.sheet = { face: kind === 'arete' ? 'arete' : 'nous' };
    renderSheet(); return;
  }
  const tab = e.target.closest('[data-face-tab]');
  if (tab && !tab.disabled) { S.sheet.face = tab.dataset.face; renderSheet(); return; }
  const buy = e.target.closest('[data-buy]');
  if (buy && !buy.disabled) {
    const costs = { accel: 3, break: 10, pool: 5 };
    const cost = costs[buy.dataset.buy];
    if (S.bank >= cost) {
      S.bank -= cost;
      if (buy.dataset.buy === 'accel') S.accelBought = true;
      if (buy.dataset.buy === 'break') S.breakBought = true;
      if (buy.dataset.buy === 'pool') S.poolJoined = true;
      renderAll();
    }
    return;
  }
  if (e.target.closest('#buy-entry')) { if (upgrade()) { S.era = 'entered'; S.bank = 0; renderAll(); syncSegs(); } return; }
  if (e.target.closest('.tip')) {
    const host = e.target.closest('.tooltip-host'), show = !host.classList.contains('show');
    document.querySelectorAll('.tooltip-host').forEach((h) => h.classList.remove('show'));
    document.querySelectorAll('.tip').forEach((t) => t.setAttribute('aria-expanded', 'false'));
    host.classList.toggle('show', show);
    host.querySelector('.tip').setAttribute('aria-expanded', String(show));
    return;
  }
  if (e.target.closest('.scrim')) { S.sheet = null; renderSheet(); }
});
document.addEventListener('keydown', (e) => {
  if (e.target.matches('input,textarea,[contenteditable]')) return;
  if (e.key === 'Escape') {
    S.sheet = null;
    document.querySelectorAll('.tooltip-host').forEach((h) => h.classList.remove('show'));
    renderSheet();
  }
});

/* ── switcher chrome ── */
function seg(container, entries, key, onpick) {
  container.innerHTML = Object.entries(entries).map(([k, w]) => `<button data-k="${k}" aria-pressed="${S[key] === k}">${w}</button>`).join('');
  container.querySelectorAll('button').forEach((b) => b.onclick = () => onpick(b.dataset.k));
}
function applyEra(k) {
  S.era = k;
  S.bank = k === 'banked' ? 1 : k === 'entered' ? 6 : 0;
  S.poolJoined = S.accelBought = S.breakBought = false;
  S.sheet = null;
  syncSegs(); renderAll();
}
function syncSegs() {
  seg(document.getElementById('era-seg'), ERAS, 'era', applyEra);
  seg(document.getElementById('mode-seg'), MODES, 'mode', (k) => { S.mode = k; syncSegs(); renderAll(); });
  document.getElementById('telegraph').checked = S.telegraph;
  document.getElementById('bonuses').checked = S.bonuses;
}
document.getElementById('telegraph').onchange = (e) => { S.telegraph = e.target.checked; renderLedger(); };
document.getElementById('bonuses').onchange = (e) => { S.bonuses = e.target.checked; renderLedger(); };
syncSegs(); renderAll();
</script>
</body></html>
