<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>FlowSynth</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- The console (ADR-0012): structurally above the game UI. On the
           desktop layout its height is fixed, so nothing below it ever moves,
           reflows, or dims while the console is used. (Mobile is the noted
           future alternative, not this effort's shape.) -->
      <header class="console">
        <div class="brand">
          <svg width="28" height="28" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <path d="M16 2 28 9v14l-12 7L4 23V9Z" />
            <path d="m10 20 5-10v12l7-10" />
          </svg>
          FlowSynth
        </div>
        <div class="console-session" id="console-session"></div>
        <div class="console-apps" id="console-apps"></div>
        <div class="console-readout">
          <div class="console-status" id="console-status"></div>
          <div class="console-slot" id="nous-balance"></div>
        </div>
        <button class="console-button" id="console-settings" aria-label="Settings" title="Settings — save data, import / export, reset">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
        <!-- The session progress strip (issue #63): the header's own bottom
             edge is the progress surface. Fill and pulse are driven by
             render.ts; it stays empty while no session runs. -->
        <div class="session-strip" id="session-strip" aria-hidden="true"><span id="session-strip-fill"></span></div>
      </header>
      <main class="workspace">
        <section class="board-panel">
          <!-- PROTOTYPE (issue #119): variant C's board-ledger strip host —
               the production ledger and feats chip docked directly above the
               board. Hidden unless the prototype renderer fills it. -->
          <div class="board-ledger" id="board-ledger" hidden></div>
          <div class="board-heading">
            <div class="board-tools" id="board-tools"></div>
            <div class="legend">
              <span><i class="rail"></i>Rail · category</span>
              <span><i class="ring"></i>Rings · rarity</span>
              <span><i class="ch"></i>Light · charge</span>
              <span><i class="am"></i>Forge output</span>
            </div>
          </div>
          <div class="manage-banner" id="manage-banner">
            <span class="manage-banner-label">Arranging</span>
            <span class="manage-banner-hint">Tiles are raised — drag them between cells or into the inventory</span>
            <span class="manage-banner-esc"><kbd>Esc</kbd> exits</span>
            <button class="primary small" id="manage-banner-done">Done</button>
          </div>
          <div class="board-space">
            <svg id="grid" role="group" aria-label="Module grid"></svg>
            <!-- The one-time welcome card (§5.1): unforced guidance over the
                 opening board — it never locks anything and never returns
                 once acknowledged or dismissed. -->
            <div class="welcome-card" id="welcome-card" hidden></div>
          </div>
          <!-- The status monitor (ADR-0015): the board footer's whole
               section — the full-width horizon rail, formula chip and Forge
               chip on its top edge, the Arete accumulator spanning beneath. -->
          <div class="board-footer status-monitor" id="status-monitor"></div>
        </section>
        <aside class="inspector" id="inspector"></aside>
      </main>
      <p class="sr-only" id="status" role="status" aria-live="polite"></p>
    </div>
    <div class="modal-backdrop" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal" id="modal-content"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
