<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>FlowSynth</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- The console (ADR-0012): structurally above the game UI, pure
           control (board-redesign spec §7): the main switch, the clock (itself
           the plan affordance — clicking it opens the Time app), pause, the
           focus-app tiles. Its height is fixed, so nothing below it ever
           moves, reflows, or dims while the console is used. Production
           reads live on the board ledger strip, never here. -->
      <header class="console">
        <div class="brand">
          <svg width="28" height="28" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <path d="M16 2 28 9v14l-12 7L4 23V9Z" />
            <path d="m10 20 5-10v12l7-10" />
          </svg>
          <span class="brand-name">FlowSynth</span>
        </div>
        <div class="console-session" id="console-session"></div>
        <div class="console-apps" id="console-apps"></div>
        <button class="console-button" id="console-settings" aria-label="Settings" title="Settings — save data, import / export, reset">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
        <!-- The session progress strip (issue #63): the header's own bottom
             edge is the progress surface. Fill and pulse are driven by
             render.ts; it stays empty while no session runs. -->
        <div class="session-strip" id="session-strip" aria-hidden="true"><span id="session-strip-fill"></span></div>
      </header>
      <main class="workspace">
        <section class="board-panel">
          <!-- The board ledger strip (§7): Nous / Rate / Session as one
               bordered instrument, the feats chip beside it — the board owns
               its production. The Rate cell carries the formula: the operand
               chain ending in the live total (ambient above the 760px
               breakpoint), the bare total and a tap-up formula sheet below. -->
          <div class="board-ledger" id="board-ledger"></div>
          <div class="board-space">
            <svg id="grid" role="group" aria-label="Module grid"></svg>
            <!-- The action row (§7): a left-edge icon dock floating over the
                 board — Catalog / Forge (count badge + charge pip) / New
                 cell. On portrait phone it re-docks as the bottom thumb bar
                 (#thumb-bar) with Inventory and Feats folded in. -->
            <div class="board-tools" id="board-tools"></div>
            <div class="thumb-bar" id="thumb-bar"></div>
            <!-- The game-info strip (§7): production reads on the board
                 surface, portrait phone only — where the tutorial helptext
                 used to sit. -->
            <div class="game-info-strip" id="game-info-strip"></div>
            <!-- The chord readout (§6): the reserved spot for the chord
                 name chips — every chord the selected module earns its
                 bonus from (pinned), or the hovered seam/voice's (asked).
                 Never floating over the board, never under the expanded
                 face. -->
            <div class="chord-readout" id="chord-readout" hidden></div>
            <!-- The Arete pill (§7): the status monitor dissolved — the
                 accumulator floats free as a translucent pill over the
                 board's bottom edge at every width. -->
            <div class="arete-pill" id="arete-pill"></div>
            <div class="zoom-cluster" id="zoom-cluster"></div>
          </div>
        </section>
      </main>
      <p class="sr-only" id="status" role="status" aria-live="polite"></p>
    </div>
    <div class="modal-backdrop" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal" id="modal-content"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
