<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>FlowSynth</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- The console (ADR-0012): structurally above the game UI, pure
           control (board-redesign spec §7), organized around the session
           gate (issue #148): brand, then the clock — itself the plan
           affordance, its disclosure opening the Focus sheet — with the
           dominant Enter/Exit main switch centered in the flexible middle,
           the focus banner's reads (habit, goal bars, ADR-0050) closing the
           cluster, the bare uncarded app doors (focus and Notes on portrait
           phone, ADR-0050's amended phone line), and Settings at the far
           right. Its height is fixed, so nothing below it ever moves,
           reflows, or dims while the console is used. Production reads live
           on the board ledger strip, never in the header — the banner's
           focus reads are the exception ADR-0050 makes, and they name
           practice state, never production. -->
      <header class="console">
        <div class="brand" role="img" title="FlowSynth" aria-label="FlowSynth">
          <svg width="28" height="28" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <path d="M16 2 28 9v14l-12 7L4 23V9Z" />
            <path d="m10 20 5-10v12l7-10" />
          </svg>
          <span class="brand-name">FlowSynth</span>
        </div>
        <div class="console-session" id="console-session"></div>
        <div class="console-apps" id="console-apps"></div>
        <button class="console-button" id="console-settings" aria-label="Settings" title="Settings — save data, import / export, reset">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
        <!-- The session progress strip (issue #63): the header's own bottom
             edge is the progress surface. Fill and pulse are driven by
             render.ts; it stays empty while no session runs. -->
        <div class="session-strip" id="session-strip" aria-hidden="true"><span id="session-strip-fill"></span></div>
      </header>
      <main class="workspace">
        <section class="board-panel">
          <!-- The board ledger (§7, issue #270): one clipped instrument
               panel — the grouped resource reads (ν · ν/s · ◇) left, the
               feats and chords chips right. The rate figure shows the
               final total: hover or focus opens the module-linked rate
               details above the 760px breakpoint, a tap opens the same
               roster as a sheet below. -->
          <div class="board-ledger" id="board-ledger"></div>
          <div class="board-space">
            <svg id="grid" role="group" aria-label="Module grid"></svg>
            <!-- The action row (§7): a left-edge icon dock floating over
                 the board — Catalog / Forge (count badge + charge pip) /
                 Add. On portrait phone it re-docks as the bottom thumb
                 bar (#thumb-bar) with Inventory and Collection folded in. -->
            <div class="board-tools" id="board-tools"></div>
            <div class="thumb-bar" id="thumb-bar"></div>
            <!-- The game-info strip (§7, issue #270): the ledger's resource
                 reads on the board surface, portrait phone only. -->
            <div class="inst-panel game-info-strip" id="game-info-strip"></div>
            <!-- The chord readout (§6): the reserved spot for the chord
                 name chips — every chord the selected module earns its
                 bonus from (pinned), or the hovered seam/voice's (asked).
                 Never floating over the board, never under the expanded
                 face. -->
            <div class="chord-readout" id="chord-readout" hidden></div>
            <!-- The ambient horizon bar (§7, issue #156): the Arete pill
                 dissolved into ambience — a wide curved-scale fill riding
                 the board's lower edge at every width. No numbers, no
                 marks, no countdown, no button. -->
            <div class="horizon-bar" id="horizon-bar"></div>
            <!-- The opening arc's one pop-up (§8): the second
                 synthesizer's card — place it beside your first; the dashed
                 ghost previews the chord; the × is what the pair earns.
                 Dismissible once; it never fires again. -->
            <div class="arc-card" id="arc-card" hidden></div>
            <!-- The Hex detail (issue #295): the module bloom's successor —
                  an owned cell's full-stack cross-section standing where the
                  grid stood: the module face below at bloom scale, the
                  Mutators face above it, the action rail beside the stack,
                  with its explicit Return control. Resting empty until a
                  click opens it. -->
            <div class="hex-detail" id="hex-detail" hidden></div>
            <!-- The vertical layer legend (issue #295): the one Modules /
                 Mutators switch as symbol buttons, shared by the grid and
                 the Hex detail — the grid reads the layer, the detail reads
                 the emphasized face. Upgrade-mode furniture; the Mutators
                 symbol stands locked-but-visible pre-entry (#273). -->
            <div class="layer-legend" id="layer-legend" hidden></div>
            <!-- The armed unlock's pill (issue #199) — resting empty until
                 the arm stands. -->
            <button class="mut-unlock-pill" id="mut-unlock-pill" hidden></button>
            <!-- The add-cell pill (#201): the armed purchase's one cost
                 spot — "New cell · <price> ν — Cancel · Esc" — and the
                 cancel itself. Resting empty whenever the mode isn't now. -->
            <button class="cell-arm-pill" id="cell-arm-pill" hidden></button>
            <!-- The tray column (§5, ADR-0027 as amended): the inventory as
                 an always-open pinned column docked at the board's right
                 edge in upgrade mode, dual-face under the vertical layer
                 legend's switch (#layer-legend — the one switch; the
                 column carries no second one). The modules face
                 (#inventory-zone) and the Mutators face (#mutator-tray)
                 swap beneath it. Portrait phone unfolds the column: the
                 modules face hides and the Mutators face re-pins as the
                 strip above the thumb bar, while the thumb bar's Inventory
                 segment opens the same tray as the dual-face sheet. -->
            <div class="tray-column" id="tray-column">
              <div class="inventory-tray" id="inventory-zone"></div>
              <div class="mutator-tray" id="mutator-tray" hidden></div>
            </div>
            <div class="zoom-cluster" id="zoom-cluster"></div>
          </div>
        </section>
      </main>
      <p class="sr-only" id="status" role="status" aria-live="polite"></p>
      <p class="mode-toast" id="mode-toast" hidden aria-hidden="true"></p>
    </div>
    <div class="modal-backdrop" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal" id="modal-content"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
