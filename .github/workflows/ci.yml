name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Issue #505: CI installs the one declared supported runtime
          # (.node-version) — the same declaration local version managers
          # read and the runtime preflight enforces.
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Issue #505: the cheap gate — declared/effective runtime parity, the
      # host calendar read, and the UI harness's storage capability — runs
      # before any check or build spends time.
      - run: npm run preflight
      - run: npm run check
      - run: npm test
      # Issue #505: the calendar-sensitive regressions run targeted under
      # UTC and a DST-observing zone — the runner forces both, so the DST
      # leg is covered even though CI's host is UTC.
      - run: npm run test:calendar
      - run: npm run build
